<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binomial Distribution Probability Generator</title>
    
    <!-- MathJax Configuration -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                pageReady: () => {
                    return MathJax.startup.defaultPageReady().then(() => {
                        // Initialize with default values from the image
                        renderContent(0.30, 10, 8, 3);
                    });
                }
            }
        };
    </script>
    <!-- MathJax Script (No Polyfill) -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.5em;
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .question-section {
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        .answer-section {
            display: none;
            background-color: #e8f4f8;
            padding: 20px;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            margin-top: 20px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #toggle-btn {
            background-color: #3498db;
        }
        #toggle-btn:hover {
            background-color: #2980b9;
        }
        #generate-btn {
            background-color: #2ecc71;
        }
        #generate-btn:hover {
            background-color: #27ae60;
        }
        .sub-question {
            margin-left: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Binomial Probability Practice</h1>
    
    <div class="question-section" id="question-content">
        <!-- Question will be injected here -->
    </div>

    <div class="controls">
        <button id="toggle-btn" onclick="toggleAnswer()">Show Answer</button>
        <button id="generate-btn" onclick="generateNewQuestion()">Generate New Question</button>
    </div>

    <div class="answer-section" id="answer-content">
        <!-- Answer will be injected here -->
    </div>
</div>

<script>
    let isAnswerVisible = false;

    function toggleAnswer() {
        const answerDiv = document.getElementById('answer-content');
        const toggleBtn = document.getElementById('toggle-btn');
        
        isAnswerVisible = !isAnswerVisible;
        
        if (isAnswerVisible) {
            answerDiv.style.display = 'block';
            toggleBtn.textContent = 'Hide Answer';
        } else {
            answerDiv.style.display = 'none';
            toggleBtn.textContent = 'Show Answer';
        }
    }

    // Helper functions for binomial calculations
    function combinations(n, k) {
        if (k < 0 || k > n) return 0;
        if (k === 0 || k === n) return 1;
        let c = 1;
        for (let i = 1; i <= k; i++) {
            c = c * (n - i + 1) / i;
        }
        return c;
    }

    function binomProb(n, p, k) {
        return combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k);
    }

    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateNewQuestion() {
        // Generate random binomial parameters
        const p = getRandomInt(1, 8) * 0.10; // Probability between 0.10 and 0.80
        const n = getRandomInt(8, 20);       // Sample size between 8 and 20
        const atLeastK = n - getRandomInt(1, 3); // Upper tail
        const fewerThanK = getRandomInt(2, 5);   // Lower tail

        // Hide answer section when generating a new question
        isAnswerVisible = false;
        document.getElementById('answer-content').style.display = 'none';
        document.getElementById('toggle-btn').textContent = 'Show Answer';

        renderContent(p, n, atLeastK, fewerThanK);
    }

    function renderContent(p, n, atLeastK, fewerThanK) {
        const p_pct = Math.round(p * 100);
        
        // Calculations for answers
        // (b) P(X >= atLeastK)
        let probAtLeast = 0;
        let atLeastSteps = [];
        for (let x = atLeastK; x <= n; x++) {
            let px = binomProb(n, p, x);
            probAtLeast += px;
            atLeastSteps.push(`P(X=${x})`);
        }
        
        // (c) P(X < fewerThanK) -> P(X <= fewerThanK - 1)
        let probFewer = 0;
        let fewerSteps = [];
        for (let x = 0; x < fewerThanK; x++) {
            let px = binomProb(n, p, x);
            probFewer += px;
            fewerSteps.push(`P(X=${x})`);
        }
        
        // (d) Mean and Standard Deviation
        const mean = n * p;
        const variance = n * p * (1 - p);
        const stdDev = Math.sqrt(variance);

        // Build Question HTML
        const questionHTML = `
            <p>Q3. A study found that ${p_pct}% of polytechnic students have visited the ArtScience Museum, the iconic lotus-shaped landmark at Marina Bay. From a class, ${n} students are randomly selected.</p>
            
            <div class="sub-question">
                <p>(a) Define a suitable random variable X to find the probabilities in (b) to (c).</p>
                <p>(b) Find the probability that at least ${atLeastK} have visited the ArtScience Museum.</p>
                <p>(c) Find the probability that fewer than ${fewerThanK} students have visited.</p>
                <p>(d) Find the mean and standard deviation of the random variable.</p>
            </div>
        `;

        // Build Answer HTML
        const answerHTML = `
            <h3>Solutions:</h3>
            
            <p><strong>(a)</strong><br>
            Let $X$ be the number of students out of ${n} who have visited the ArtScience Museum.<br>
            $X$ follows a Binomial distribution: $X \\sim B(n, p)$<br>
            where $n = ${n}$ and $p = ${p.toFixed(2)}$<br>
            So, <strong>$X \\sim B(${n}, ${p.toFixed(2)})$</strong></p>

            <p><strong>(b)</strong> Probability that at least ${atLeastK} have visited ($P(X \\ge ${atLeastK})$):<br>
            $P(X \\ge ${atLeastK}) = ${atLeastSteps.join(' + ')}$<br>
            $P(X \\ge ${atLeastK}) = \\sum_{x=${atLeastK}}^{${n}} \\binom{${n}}{x} (${p.toFixed(2)})^x (${(1-p).toFixed(2)})^{${n}-x}$<br>
            $P(X \\ge ${atLeastK}) = \\mathbf{${probAtLeast.toFixed(4)}}$</p>

            <p><strong>(c)</strong> Probability that fewer than ${fewerThanK} have visited ($P(X < ${fewerThanK})$):<br>
            $P(X < ${fewerThanK}) = P(X \\le ${fewerThanK - 1}) = ${fewerSteps.join(' + ')}$<br>
            $P(X < ${fewerThanK}) = \\sum_{x=0}^{${fewerThanK - 1}} \\binom{${n}}{x} (${p.toFixed(2)})^x (${(1-p).toFixed(2)})^{${n}-x}$<br>
            $P(X < ${fewerThanK}) = \\mathbf{${probFewer.toFixed(4)}}$</p>

            <p><strong>(d)</strong> Mean and Standard Deviation:<br>
            Mean $\\mu = np = ${n} \\times ${p.toFixed(2)} = \\mathbf{${mean.toFixed(2)}}$<br>
            Standard Deviation $\\sigma = \\sqrt{np(1-p)} = \\sqrt{${n} \\times ${p.toFixed(2)} \\times ${(1-p).toFixed(2)}} = \\sqrt{${variance.toFixed(4)}} = \\mathbf{${stdDev.toFixed(4)}}$</p>
        `;

        document.getElementById('question-content').innerHTML = questionHTML;
        document.getElementById('answer-content').innerHTML = answerHTML;

        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise().catch((err) => console.log('MathJax error: ', err.message));
        }
    }
</script>

</body>
</html>
